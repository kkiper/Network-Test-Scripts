! ============================================================================
! Test switch configuration for verifying unused patch panel runs
! Platform: Cisco Catalyst 9200 (IOS XE). Adjust names/addresses to suit.
!
! How it is used: each test port is patched to the far end of an unused run.
! The production switch (e.g. ESS 3300) advertises itself over CDP when the
! link comes up, so the test switch learns which production port the run lands
! on. Nothing is configured on the production switches.
! ============================================================================
!
hostname NETTEST
!
! --- Management ------------------------------------------------------------
! The C9200 has no dedicated management Ethernet port, so Gi1/0/24 is used to
! connect the laptop running the test tool. NEVER patch this port to a run.
vlan 99
 name MGMT
!
interface Vlan99
 description Management for the test tool
 ip address 192.168.100.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/0/24
 description MGMT - laptop running the test tool (do not patch to a run)
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
!
! --- SSH access ------------------------------------------------------------
! privilege 15 lets the tool clear the CDP/LLDP tables between batches
! without a separate enable secret.
ip domain name nettest.local
username admin privilege 15 secret <choose-a-password>
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
! Generate the SSH key once (global configuration mode):
!   crypto key generate rsa modulus 2048
!
! --- Neighbour discovery ---------------------------------------------------
! CDP is what Cisco production switches send by default. LLDP is also
! listened to, in case a production switch has it enabled.
cdp run
lldp run
!
! --- Test ports ------------------------------------------------------------
! Routed ports ("no switchport"):
!  * never forward traffic between ports, so several runs to the same
!    production switch can be connected at once without creating a loop;
!  * send no spanning-tree BPDUs, so BPDU guard on production ports isn't
!    triggered;
!  * still send and receive CDP/LLDP.
interface range GigabitEthernet1/0/1 - 23
 description TEST PORT - patch to unused run
 no switchport
 no ip address
 cdp enable
 lldp transmit
 lldp receive
 no shutdown
!
end
!
! ---------------------------------------------------------------------------
! In the test tool, set:  Management IP 192.168.100.2, username admin,
! test ports Gi1/0/1-23. Give the laptop an address such as 192.168.100.10/24
! and connect it to Gi1/0/24.
!
! Fallback ONLY if a test port can't be made a routed port: put every test
! port in its own unused VLAN with BPDUs filtered, so ports can't bridge
! together, then tick "allow_switchports" in the inventory:
!   interface GigabitEthernet1/0/1
!    switchport mode access
!    switchport access vlan 901          ! a different VLAN for every port
!    spanning-tree bpdufilter enable
! ---------------------------------------------------------------------------
