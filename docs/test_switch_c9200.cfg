! ============================================================================
! Test switch configuration for verifying unused patch panel runs
! Platform: Cisco Catalyst C9200L-24T-4X-E (IOS XE): 24 copper ports
! (Gi1/0/1-24) and 4 x 10G SFP+ uplinks (Te1/1/1-4). Adjust names/addresses
! to suit; it also fits other Catalyst 9200 models.
!
! How it is used (see docs/test_switch_setup.png):
!  * Test ports (Gi1/0/1-22, Te1/1/1-2) are patched to the far ends of unused
!    runs / fiber channels. The production switch (e.g. ESS 3300) advertises
!    itself over CDP when the link comes up, so the test switch learns which
!    production port each run lands on.
!  * Gi1/0/24 (laptop) and Gi1/0/23 (production link to SW-CORE-01) are
!    switched together, so the laptop is on the devices' VLAN and can ping and
!    read the MACs of devices on SW-CORE-01 and anything daisy-chained to it.
! Nothing is configured on the production switches.
! ============================================================================
!
hostname NETTEST
!
! --- Production VLAN: laptop port, production link and management -----------
! VLAN 10 exists only on this test switch: it groups the laptop port and the
! production link. The VLAN number doesn't need to match production, because
! Gi1/0/23 is an access port facing an access port on SW-CORE-01.
vlan 10
 name PROD
!
! Management on a SPARE address in the devices' subnet (example values; check
! with the network owner that the address is free).
interface Vlan10
 description Test switch management, on the production subnet
 ip address 192.168.1.250 255.255.255.0
 no shutdown
!
! Laptop running the test tool. Give the laptop another spare address in the
! same subnet (e.g. 192.168.1.240/24). NEVER patch this port to a run.
interface GigabitEthernet1/0/24
 description LAPTOP - test tool (do not patch to a run)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
! Production link: through PP-Z:23 / PP-A:23 to an existing SW-CORE-01 access
! port in the devices' VLAN. BPDU filtering stops this switch sending
! spanning-tree BPDUs, so BPDU guard on SW-CORE-01 isn't tripped.
! *** Only ONE link between this switch and production: with BPDUs filtered,
! *** a second link would create a loop that spanning tree can't detect.
interface GigabitEthernet1/0/23
 description PRODUCTION LINK to SW-CORE-01 (only one!)
 switchport mode access
 switchport access vlan 10
 spanning-tree bpdufilter enable
 no shutdown
!
! --- SSH access ------------------------------------------------------------
! privilege 15 lets the tool clear the CDP/LLDP tables between batches
! without a separate enable secret.
ip domain name nettest.local
username admin privilege 15 secret <choose-a-password>
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
! Generate the SSH key once (global configuration mode):
!   crypto key generate rsa modulus 2048
!
! --- Neighbour discovery ---------------------------------------------------
! CDP is what Cisco production switches send by default. LLDP is also
! listened to, in case a production switch has it enabled.
cdp run
lldp run
!
! --- Test ports ------------------------------------------------------------
! Routed ports ("no switchport"):
!  * never forward traffic between ports, so several runs to the same
!    production switch can be connected at once without creating a loop;
!  * send no spanning-tree BPDUs, so BPDU guard on production ports isn't
!    triggered;
!  * still send and receive CDP/LLDP.
interface range GigabitEthernet1/0/1 - 22
 description TEST PORT - patch to unused run
 no switchport
 no ip address
 cdp enable
 lldp transmit
 lldp receive
 no shutdown
!
! --- Fiber test ports (10G SFP+) ---------------------------------------------
! Te1/1/1-2 take the 10GBASE-SR multimode SFP+ modules (SFP-10GSR-85-I) and
! connect to the fiber channels (P1/S1, P2/S2) going to the production
! switch's SFP+ ports. Routed for the same reasons as the copper test ports.
! The tool reads the modules' light levels (DOM) and watches for errors.
interface range TenGigabitEthernet1/1/1 - 2
 description FIBER TEST PORT - patch to fiber channel
 no switchport
 no ip address
 cdp enable
 lldp transmit
 lldp receive
 no shutdown
!
! Non-Cisco SFP+ modules: if a fiber test port shows "err-disabled" (reason
! gbic-invalid) or the module isn't recognised, the switch is rejecting a
! third-party module. These commands make it accept them. The first is a
! hidden IOS XE command, not supported by Cisco TAC; use only on this test
! switch:
!   service unsupported-transceiver
!   no errdisable detect cause gbic-invalid
! Then 'shutdown' / 'no shutdown' the port.
!
end
!
! ---------------------------------------------------------------------------
! In the test tool, set:  Management IP 192.168.1.250, username admin,
! copper test ports Gi1/0/1-22, fiber (SFP+) ports Te1/1/1-2.
! Connect the laptop to Gi1/0/24 and give it a spare address in the devices'
! subnet, e.g. 192.168.1.240/24 (no default gateway needed). Ping Test and
! Discover then reach the devices through Gi1/0/23 and SW-CORE-01.
! Never list Gi1/0/23 or Gi1/0/24 as test ports: the tool refuses switchports.
!
! Fallback ONLY if a test port can't be made a routed port: put every test
! port in its own unused VLAN with BPDUs filtered, so ports can't bridge
! together, then tick "allow_switchports" in the inventory:
!   interface GigabitEthernet1/0/1
!    switchport mode access
!    switchport access vlan 901          ! a different VLAN for every port
!    spanning-tree bpdufilter enable
! ---------------------------------------------------------------------------
