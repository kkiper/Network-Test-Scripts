! =====================================================================
! Read-only access for the Switch Port Audit - production switches
! (SW-CORE-01, SW-EDGE-02, ... ESS 3300 / IOS XE)
!
! This is a REQUEST for the network owner, not something the tool does.
! The audit only logs in and runs these user-level (privilege 1) commands:
!     show interfaces status
!     show mac address-table
!     show cdp neighbors detail
!     show lldp neighbors detail
! It never enters enable mode, never clears anything, never configures.
!
! Nothing else changes: no port configuration, no VLANs, no MAC aging
! change, no SPAN. Replace <password> and the addresses with your own.
! =====================================================================
!
! --- 1. A read-only login (pick ONE of a or b) ------------------------
!
! a) Local user at privilege 1 (cannot enter configuration or enable):
username netcheck-ro privilege 1 secret <password>
!
! b) Or, where logins come from TACACS+/RADIUS, a read-only role for
!    "netcheck-ro" on the AAA server (privilege 1 / shell:priv-lvl=1)
!    instead of the local user above.
!
! --- 2. SSH - usually already enabled; shown for reference ------------
!
! Only if the switch has no SSH key yet:
!   ip domain name example.local
!   crypto key generate rsa modulus 2048
! Keep the existing AAA login method if there is one, instead of "login local".
ip ssh version 2
line vty 0 15
 login local
 transport input ssh
!
! --- 3. Only if a site has restricted the show commands ---------------
!
! On a default IOS XE switch these commands already work at privilege 1.
! If the audit reports "% Invalid input" or "Command authorization failed"
! for one of them, it was moved to a higher level; this moves it back:
!
! privilege exec level 1 show mac address-table
! privilege exec level 1 show interfaces status
! privilege exec level 1 show cdp neighbors detail
! privilege exec level 1 show lldp neighbors detail
!
! --- 4. Optional: LLDP ------------------------------------------------
!
! CDP is on by default. LLDP is only needed to hear devices that announce
! themselves over LLDP (e.g. a server NIC with firmware LLDP enabled).
! The audit works without it.
!
! lldp run
!
! --- Reachability ----------------------------------------------------
!
! The laptop reaches each switch's management address through the test
! switch's production link (laptop -> test switch Gi1/0/24 -> Gi1/0/23
! -> SW-CORE-01 access port in the devices' VLAN). The management
! addresses must be on that same subnet, e.g. SW-CORE-01 192.168.1.2,
! SW-EDGE-02 192.168.1.3. Put them in the inventory's "switches" section.
!
end
